spring:
  application:
    name: price-radar
  task:
    scheduling:
      pool:
        size: 3
      thread-name-prefix: priceradar-scheduled-
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  error:
    include-binding-errors: never
    include-exception: false
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never
  info:
    build:
      enabled: true
    env:
      enabled: false
    java:
      enabled: false
    os:
      enabled: false
    process:
      enabled: false

priceradar:
  operations:
    actuator:
      username: ${ACTUATOR_USERNAME}
      password: ${ACTUATOR_PASSWORD}
  user:
    defaults:
      city-name: Moscow
      dest: 1259570991
      spp: 30
      wallet-discount-percent: 3
  provider:
    wildberries:
      endpoint: https://card.wb.ru/cards/v4/detail
      min-request-delay: PT3S
      request-timeout: PT10S
      cache-ttl: PT5M
      cache-max-entries: 10000
      max-attempts: 3
      base-backoff: PT2S
      max-backoff: PT1M
      max-retry-after: PT24H
      max-response-bytes: 2097152
  telegram:
    enabled: ${TELEGRAM_BOT_ENABLED:true}
    api-base-url: https://api.telegram.org/
    long-polling-timeout: PT25S
    request-timeout: PT10S
    initial-delay: PT1S
    poll-delay: PT1S
    bot-key: primary
    max-update-attempts: 5
    max-retry-after: PT1H
    max-response-bytes: 1048576
  notification:
    delivery:
      initial-delay: PT5S
      poll-delay: PT5S
      batch-size: 25
      max-attempts: 5
      claim-timeout: PT30S
      base-backoff: PT10S
      max-backoff: PT15M
  scheduler:
    enabled: ${PRICE_SCHEDULER_ENABLED:true}
    initial-delay: PT10S
    poll-delay: PT60S
    batch-size: 20
    refresh-interval: ${PRICE_SCHEDULER_REFRESH_INTERVAL:PT6H}
    max-jitter: ${PRICE_SCHEDULER_MAX_JITTER:PT30M}
    failure-retry-delay: PT5M
