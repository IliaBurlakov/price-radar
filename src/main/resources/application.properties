spring.application.name=price-radar
spring.task.scheduling.pool.size=3
spring.task.scheduling.thread-name-prefix=priceradar-scheduled-

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

server.error.include-binding-errors=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-stacktrace=never

management.endpoints.web.exposure.include=health,info,metrics
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.info.build.enabled=true
management.info.env.enabled=false
management.info.java.enabled=false
management.info.os.enabled=false
management.info.process.enabled=false

priceradar.operations.actuator.username=${ACTUATOR_USERNAME}
priceradar.operations.actuator.password=${ACTUATOR_PASSWORD}
priceradar.user.defaults.wallet-discount-percent=3

# Product policies. These values are deliberately centralized instead of duplicated in services and Telegram text.
priceradar.policy.active-subscription-limit=50
priceradar.policy.max-product-links-per-message=50
priceradar.policy.quote-ttl=PT15M
priceradar.policy.pending-action-ttl=PT15M
priceradar.policy.shared-basket-import-ttl=PT15M

priceradar.provider.wildberries.endpoint=https://card.wb.ru/cards/v4/detail
priceradar.provider.wildberries.shared-basket-endpoint=https://wbx-api-gateway.wildberries.ru/share-basket/api/v1/basket/
priceradar.provider.wildberries.shared-basket-cards-endpoint=https://card.wb.ru/cards/v4/list
priceradar.provider.wildberries.min-request-delay=PT3S
priceradar.provider.wildberries.request-timeout=PT10S
priceradar.provider.wildberries.cache-ttl=PT5M
priceradar.provider.wildberries.cache-max-entries=10000
priceradar.provider.wildberries.batch-size=50
priceradar.provider.wildberries.max-attempts=3
priceradar.provider.wildberries.base-backoff=PT2S
priceradar.provider.wildberries.max-backoff=PT1M
priceradar.provider.wildberries.max-retry-after=PT24H
priceradar.provider.wildberries.max-response-bytes=2097152
priceradar.provider.wildberries.rate-limit-cooldown=PT15M
priceradar.provider.wildberries.access-forbidden-cooldown=PT30M
priceradar.provider.wildberries.server-error-cooldown=PT5M
priceradar.provider.wildberries.invalid-response-cooldown=PT15M
priceradar.provider.wildberries.max-backoff-jitter=PT1S

priceradar.telegram.enabled=${TELEGRAM_BOT_ENABLED:true}
priceradar.telegram.api-base-url=https://api.telegram.org/
priceradar.telegram.long-polling-timeout=PT25S
priceradar.telegram.request-timeout=PT10S
priceradar.telegram.initial-delay=PT1S
priceradar.telegram.poll-delay=PT1S
priceradar.telegram.bot-key=primary
priceradar.telegram.max-update-attempts=5
priceradar.telegram.max-retry-after=PT1H
priceradar.telegram.max-response-bytes=1048576

priceradar.notification.delivery.initial-delay=PT5S
priceradar.notification.delivery.poll-delay=PT5S
priceradar.notification.delivery.batch-size=25
priceradar.notification.delivery.max-attempts=5
priceradar.notification.delivery.claim-timeout=PT30S
priceradar.notification.delivery.base-backoff=PT10S
priceradar.notification.delivery.max-backoff=PT15M

priceradar.scheduler.enabled=${PRICE_SCHEDULER_ENABLED:true}
priceradar.scheduler.initial-delay=PT10S
priceradar.scheduler.poll-delay=PT60S
priceradar.scheduler.batch-size=20
priceradar.scheduler.refresh-interval=${PRICE_SCHEDULER_REFRESH_INTERVAL:PT6H}
priceradar.scheduler.max-jitter=${PRICE_SCHEDULER_MAX_JITTER:PT30M}
priceradar.scheduler.failure-retry-delay=PT5M
